<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campfire Black Piano</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #eef4f8;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 166, 89, .22), transparent 24%),
          radial-gradient(circle at 84% 92%, rgba(96, 133, 255, .22), transparent 28%),
          linear-gradient(180deg, #343945 0%, #16191f 42%, #07080b 100%);
      }
      .shell {
        width: 100%;
        height: 100%;
        position: relative;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255,255,255,.16);
        background:
          linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,0) 34%),
          linear-gradient(135deg, rgba(255,255,255,.05), rgba(255,255,255,0));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
      }
      .card {
        width: min(310px, calc(100vw - 32px));
        height: min(385px, calc(100vh - 32px));
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 26px;
        background: linear-gradient(180deg, rgba(36,40,49,.75), rgba(8,10,13,.62));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 28px 70px rgba(0,0,0,.42);
      }
      .iconWrap {
        width: 150px;
        height: 150px;
        display: grid;
        place-items: center;
        border-radius: 35px;
        background: radial-gradient(circle at 50% 45%, rgba(255, 168, 77, .22), rgba(255,255,255,.02) 56%, rgba(0,0,0,.16));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 18px 46px rgba(255,121,35,.16);
      }
      .iconWrap img {
        width: 124px;
        height: 124px;
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgba(255, 132, 38, .34));
        animation: float 2.3s ease-in-out infinite;
      }
      h1 {
        margin: 18px 0 2px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: .02em;
        text-shadow: 0 1px 0 rgba(255,255,255,.09);
      }
      p {
        margin: 0;
        color: #aeb9c3;
        font-size: 12px;
      }
      .bar {
        width: 185px;
        height: 7px;
        margin-top: 28px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255,255,255,.08);
        box-shadow: inset 0 1px 2px rgba(0,0,0,.45);
      }
      .bar span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ff7b31, #ffd05f, #699cff);
        animation: load 1.15s ease-in-out infinite;
      }
      .caption {
        margin-top: 12px;
        color: #76828e;
        font-size: 10px;
      }
      @keyframes load {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.015); }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <div class="iconWrap">
          <img src="/campfire-icon.png" alt="Campfire" />
        </div>
        <h1>Campfire</h1>
        <p>Black Piano Alpha</p>
        <div class="bar"><span></span></div>
        <div class="caption">acendendo a fogueira...</div>
      </section>
    </main>
  </body>
</html>
